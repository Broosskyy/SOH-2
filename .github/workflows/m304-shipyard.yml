name: Abyssal Dominion M304.9 Android curated user art ZIP import and gameplay QA

on:
  push:
    branches: [rebuild/m3049-mobile-artpack-import]
    paths:
      - '.github/workflows/m304-shipyard.yml'
      - 'tests/m3037_graphics_integration_smoke.gd'
      - 'tests/m3037_combat_smoke.gd'
      - 'tools/build_m3035_android.py'
      - 'scripts/classic/**'
      - 'assets/classic/original_ui/**'
      - 'tests/m3038_ammo_visual_smoke.gd'
      - 'tests/m3038_world_loot_smoke.gd'
      - 'tests/m3039_world_ships_smoke.gd'
      - 'tests/m304_shipyard_quest_smoke.gd'
      - 'tests/m3042_live_hud_helm_smoke.gd'
      - 'tests/m3043_original_fleet_smoke.gd'
      - 'tests/m3044_ammo_shipyard_hud_smoke.gd'
      - 'tests/m3045_original_world_smoke.gd'
      - 'tests/m3046_immediate_course_smoke.gd'
      - 'tests/m3046_reference_sprite_capture.gd'
      - 'tests/m3047_atlas_visual_audit.gd'
      - 'tests/m3047_health_safe_art_smoke.gd'
      - 'tests/m3048_user_art_skins_smoke.gd'
      - 'tests/m3049_user_art_zip_import_smoke.gd'
      - 'tests/m3045_visual_capture.gd'
      - 'tests/m3041_chainshot_load_probe.gd'
      - 'project.godot'
      - 'scripts/visual/p0_replacement_qa.gd'
      - 'scenes/classic/**'
      - 'export_presets.cfg'
  workflow_dispatch:

concurrency:
  group: abyssal-dominion-m3049-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Stage existing M303.6 source graphics into build workspace only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/rebuild/classic-seafight-m303
          git restore --source=FETCH_HEAD --worktree -- assets/classic/private_seabattles assets/classic/private_seaofbones
          # Original OBJ/large textures are not runtime sprites and must not be packaged.
          rm -rf assets/classic/private_seaofbones/models
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('assets/classic')
          for folder in ('private_seabattles', 'private_seaofbones'):
              d = root/folder
              pack = json.loads((d/'pack.json').read_text())
              for name, spec in pack['actors'].items():
                  image = d/spec['path']
                  assert image.is_file() and image.stat().st_size > 1024, f'{folder}/{name} missing or tiny'
              assert (d/pack['ocean']['path']).is_file()
              print('STAGED', folder, 'actors', len(pack['actors']), 'source', pack['source_label'])
          PY
          test -z "$(git diff --name-only)"  # No persistent art changes on integration branch
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          exe="$(find /tmp/godot-bin -maxdepth 2 -type f -name '*linux.x86_64' | head -1)"
          test -n "$exe"
          sudo install -m 0755 "$exe" /usr/local/bin/godot
          godot --headless --version
      - name: Install official Android export template
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p /tmp/templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          rm -f /tmp/templates.tpz
      - name: Generate ephemeral Android debug signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Abyssal Dominion,C=DE"
      - name: Import source with all private test sprites and fail on GDScript errors
        timeout-minutes: 4
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/m304-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' /tmp/m304-import.log; then
            echo "Godot script compilation failed; diagnose parent chainshot script before abort."
            for script in scripts/classic/m3035_render_adapter.gd scripts/classic/m3036_unified_sea_map.gd scripts/classic/m304_shipyard_hud.gd scripts/classic/m3041_chainshot_combat.gd scripts/classic/m3042_navigation_hud_stability.gd; do
              echo "CHECKING $script"
              timeout 14s godot --headless --path . --check-only -s "res://$script" || true
            done
            exit 1
          fi
      - name: Extract and audit real ship atlas frames before graphical acceptance
        timeout-minutes: 5
        run: godot --headless --path . --script res://tests/m3047_atlas_visual_audit.gd
      - name: Headless M303.7 gameplay regression test
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m3037_combat_smoke.gd
      - name: Verify both graphics packs in actual game scene and live swap
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m3037_graphics_integration_smoke.gd
      - name: Verify actual in-game ammo meshes and functional quickbar
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m3038_ammo_visual_smoke.gd
      - name: Verify extra NPCs and physical treasure pickup
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m3038_world_loot_smoke.gd
      - name: Verify shoreline, combat ship classes, and wake correction
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m3039_world_ships_smoke.gd
      - name: Verify purchasable shipyard, combat upgrades and bounty quest
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m304_shipyard_quest_smoke.gd
      - name: Verify M304.2 chainshot, healthy sprite frames, collision-safe helm and touch HUD
        timeout-minutes: 3
        run: godot --headless --path . --script res://tests/m3042_live_hud_helm_smoke.gd
      - name: Verify original 3D fleet, procedural sea and real HP damage states
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3043_original_fleet_smoke.gd
      - name: Verify illustrated naval HUD, ammo purchasing and responsive UI
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3044_ammo_shipyard_hud_smoke.gd
      - name: Verify real original world, biomes, kraken, wave shader and untouched gameplay
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3045_original_world_smoke.gd
      - name: Render the actual SeaBattles test sprites, ammunition menu and shipyard (not Android)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-method gl_compatibility --path . --script res://tests/m3046_reference_sprite_capture.gd
      - name: Verify immediate tap speed and reference-art first launch
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3046_immediate_course_smoke.gd
      - name: Assert visually audited full-sail frames and user top-down import, at ALL hull HP
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3047_health_safe_art_smoke.gd
      - name: Verify private original ship skins, independent cosmetic FX and functional ammo HUD
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3048_user_art_skins_smoke.gd
      - name: Verify Android native ZIP picker, safe curated image import and live actor HUD preservation
        timeout-minutes: 4
        run: godot --headless --path . --script res://tests/m3049_user_art_zip_import_smoke.gd
      - name: Build Android test APK with real integrated graphics (no placeholder option)
        run: |
          set -euo pipefail
          python3 tools/build_m3035_android.py --godot godot --android-sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --debug-keystore "$HOME/.android/debug.keystore" --output builds/android/ABYSSAL_DOMINION_M3049_ART_ZIP_IMPORT.apk 2>&1 | tee /tmp/m304-apk-export.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script' /tmp/m304-apk-export.log; then
            echo "Godot reported script errors during Android export"
            exit 1
          fi
      - name: Upload M304.9 user art import Android APK (reference graphics; not public release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abyssal-Dominion-M3049-ZIP-IMPORT-ANDROID-TEST
          path: |
            builds/android/ABYSSAL_DOMINION_M3049_ART_ZIP_IMPORT.apk
            builds/android/ABYSSAL_DOMINION_M3049_ART_ZIP_IMPORT.build.json
            builds/android/ABYSSAL_DOMINION_M3049_ART_ZIP_IMPORT.signature.txt
            builds/visual/*.png
            builds/atlas_audit/**
          if-no-files-found: error
          retention-days: 7
